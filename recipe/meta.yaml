{% set name = "optimix" %}
{% set version = "3.0.3" %}
{% set sha256 = "66f70bf4c650a382992c13a8b716df6d18d42420ccc7b69adebec24c65a49329" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=36.7.2
    - pytest-runner
    - pypandoc
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - ndarray-listener >=1.1.1
    - brent-search >=1.0.32
    - tqdm

test:
  requires:
    - pytest
    - pytest-pep8
    - python {{ python_min }}
  imports:
    - optimix
  commands:
    - python -c "import sys; import optimix; sys.exit(optimix.test())"

about:
  home: https://github.com/limix/optimix
  license: MIT
  license_family: MIT
  license_file: LICENSE.md
  summary: 'Abstract function optimisation'
  doc_url: https://optimix.readthedocs.io/
  dev_url: https://github.com/limix/optimix

extra:
  recipe-maintainers:
    - Horta
